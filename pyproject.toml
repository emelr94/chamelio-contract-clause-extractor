[project]
name = "contract-clause-extractor"
version = "0.1.0"
description = "FastAPI service that extracts and structures clauses from legal contracts"
authors = [
    { name = "emelr94", email = "emel.rizvanovic.sa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
